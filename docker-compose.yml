services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: berabot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d berabot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  observer:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_ROLE: observer
      EXECUTION_ENABLED: "false"
      SCANNER_ENABLED: "false" # redundant: the block-indexer discovers pools/tokens/dex from the block stream
    volumes:
      - ./logs:/app/logs # unified rotating log file (system-observer.log) persists on the host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  brain:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_ROLE: brain
    volumes:
      - ./logs:/app/logs # unified rotating log file (system-brain.log) persists on the host — THE observability log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # KG Reality Observatory (Item 4-7): continuous block-driven observer + surface intelligence. READ-ONLY +
  # shadow eth_call only (NO broadcast). A DB advisory singleton lock guarantees only one instance ever
  # processes blocks, so restart/overlap never double-counts. The time series it records cannot be rebuilt
  # retroactively → restart: always protects it.
  kg-observer:
    build: .
    command: ["node", "dist/scripts/kg-observer.js"]
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_ROLE: observer # kg-observer.js ignores this (standalone script); config only validates the enum
      EXECUTION_ENABLED: "false"
      SCANNER_ENABLED: "false"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
