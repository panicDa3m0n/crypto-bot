services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: berabot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d berabot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  observer:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_ROLE: observer
      EXECUTION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  brain:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_ROLE: brain
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
